 body[data-print="discursos"] .discursos-screen{display:none!important}.discursos-print-only{display:block!important}.speech-print-head{font-size:12pt;font-weight:bold;border-bottom:2px solid #555;padding-bottom:3mm;margin-bottom:8mm}.speech-print-head b{font-size:11pt}.speech-print-section{position:relative;margin:0 0 10mm;padding-left:7mm;break-inside:avoid!important}.speech-print-label{text-align:center;font-size:9.5pt;font-weight:bold;color:#777;margin-bottom:3mm}.speech-print-section table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt}.speech-print-section th,.speech-print-section td{border:1px solid #222;padding:2mm;text-align:center;vertical-align:middle}.speech-print-section th{background:#c99a00!important;color:#fff!important}.speech-print-section tbody tr:nth-child(odd) td{background:#d9d9d9!important}.speech-print-section th:nth-child(1){width:9%}.speech-print-section th:nth-child(2){width:15%}.speech-print-section th:nth-child(3){width:38%}.speech-print-section th:nth-child(4){width:19%}.speech-print-section th:nth-child(5){width:19%}.speech-month-bar{position:absolute;left:0;top:18mm;bottom:0;width:5mm;background:#c99a00;color:#fff;font-size:7pt;font-weight:bold;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center}

<body>
<div id="login" class="login">
  <div class="login-card">
    <div style="font-size:42px">🏛️</div><h1>Congregação Vila</h1>
    <p class="muted">Acesso por e-mail</p>
    <div id="login1"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com">
      <button class="btn" style="width:100%;margin-top:12px" onclick="sendCode()">Enviar código</button></div>
    <div id="login2" class="hidden"><p>Código enviado para <b id="sent"></b>.</p><label>Código</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code"><button class="btn" style="width:100%;margin-top:12px" onclick="verifyCode()">Entrar</button>
      <button class="btn light" style="width:100%;margin-top:8px" onclick="backLogin()">Trocar e-mail</button></div>
    <div id="loginMsg" class="login-msg"></div><small class="muted">Somente e-mails autorizados pelo administrador entram.</small>
  </div>
</div>

<div class="app hidden" id="appShell">
<aside class="side">
  <button data-page="home">🏠 Início</button><button data-page="programacao">📅 Programação</button>
  <button data-page="meus">👤 Meus privilégios</button><button data-page="assistencia">📊 Assistência</button><button data-page="quadro">📋 Quadro</button>
  <button data-page="privilegios">🎯 Privilégios</button><button data-page="grupos">👥 Grupos</button>
  <button data-page="limpeza">🧹 Limpeza</button><button data-page="publicacoes">📚 Publicações</button><button data-page="discursos">🎤 Discursos Públicos</button>
  <button data-page="pessoas">👨‍👩‍👦 Pessoas</button><button data-page="admin" id="adminNav">⚙️ Administração</button>
</aside>
<main class="main">
<header><h1>Congregação Vila</h1><div style="display:flex;align-items:center;gap:10px"><span id="userLabel"></span><button class="btn light no-print" onclick="logout()">Sair</button></div></header>
<div class="mobile-nav no-print" id="mobileNav">
  <button data-page="home">🏠 Início</button><button data-page="programacao">📅 Programação</button>
  <button data-page="meus">👤 Meus privilégios</button><button data-page="assistencia">📊 Assistência</button><button data-page="quadro">📋 Quadro</button>
  <button data-page="privilegios">🎯 Privilégios</button><button data-page="grupos">👥 Grupos</button><button data-page="limpeza">🧹 Limpeza</button>
  <button data-page="publicacoes">📚 Publicações</button><button data-page="discursos">🎤 Discursos Públicos</button><button data-page="pessoas">👨‍👩‍👦 Pessoas</button><button data-page="admin" id="mobileAdminNav">⚙️ Administração</button>
</div>
<div class="content" id="content"></div>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<script>
const SUPABASE_URL='https://somxvqwpqhnxjxavhwvb.supabase.co';
const SUPABASE_KEY='sb_publishable_c1qfUYeooWwsvcHF0_7Rfw_PwKk2PSp';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentAccess=null;
let cache={pessoas:[],funcoes:[],habilitacoes:[],programacoes:[],oficiais:[],designacoes:[],assistencia:[],grupos:[],limpeza:[],discursos:[]};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(v){if(!v)return '—'; const [y,m,d]=String(v).slice(0,10).split('-'); return d&&m&&y?`${d}/${m}/${y}`:String(v)}
function isoDate(v){return v?String(v).slice(0,10):''}
function msg(t){document.getElementById('loginMsg').textContent=t}
function page(){return location.hash.slice(1)||'home'}
function nav(){document.querySelectorAll('.side button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page()));document.getElementById('mobileAdminNav')?.classList.toggle('hidden',currentAccess?.perfil!=='administrador')}
function canEdit(){return currentAccess?.perfil==='administrador'}
function printIt(type){document.body.dataset.print=type;const old=document.getElementById('dynamicPrintPage');if(old)old.remove();const st=document.createElement('style');st.id='dynamicPrintPage';st.textContent=(type==='grupos'||type==='assistencia'||type==='board')?'@page{size:A4 landscape;margin:6mm}':'@page{size:A4 portrait;margin:6mm}';document.head.appendChild(st);window.print();setTimeout(()=>{document.body.removeAttribute('data-print');st.remove()},1000)}
function roleNotice(){return canEdit()?'<span class="badge">Administrador: edição liberada</span>':'<span class="badge">Somente visualização e impressão</span>'}
function setContent(html){document.getElementById('content').innerHTML=html}
function statusLine(t){return `<div class="muted" style="margin:10px 0">${esc(t)}</div>`}

async function sendCode(){let e=document.getElementById('email').value.trim().toLowerCase();if(!e)return msg('Digite seu e-mail.');msg('Enviando...');let r=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});if(r.error)return msg(r.error.message);document.getElementById('sent').textContent=e;document.getElementById('login1').classList.add('hidden');document.getElementById('login2').classList.remove('hidden');msg('Código enviado.')}
async function verifyCode(){let e=document.getElementById('email').value.trim().toLowerCase(),t=document.getElementById('code').value.trim();if(!t)return msg('Digite o código.');msg('Validando...');let r=await sb.auth.verifyOtp({email:e,token:t,type:'email'});if(r.error)return msg(r.error.message);currentUser=r.data.user;await finishLogin()}
function backLogin(){document.getElementById('login2').classList.add('hidden');document.getElementById('login1').classList.remove('hidden');msg('')}
async function finishLogin(){
 if(!currentUser)return;
 let q=await sb.from('priv_acessos').select('*').eq('email',currentUser.email).eq('ativo',true).limit(1).maybeSingle();
 let access=q.data;
 if(!access){let p=await sb.from('perfis_usuarios').select('*').eq('user_id',currentUser.id).eq('ativo',true).maybeSingle();if(p.data)access={...p.data,email:currentUser.email}}
 if(!access){await sb.auth.signOut();msg('Seu e-mail ainda não foi liberado pelo administrador.');return}
 currentAccess=access;document.getElementById('login').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');
 document.getElementById('userLabel').textContent=(access.nome||currentUser.email)+' · '+(access.perfil||'visualizador');
 document.getElementById('adminNav').classList.toggle('hidden',access.perfil!=='administrador');document.getElementById('mobileAdminNav')?.classList.toggle('hidden',access.perfil!=='administrador');
 await loadBase();render();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function loadBase(){
 const jobs=[
  ['pessoas',sb.from('priv_pessoas').select('*').eq('ativo',true).order('nome')],
  ['funcoes',sb.from('priv_funcoes').select('*').eq('ativo',true).order('nome')],
  ['habilitacoes',sb.from('priv_habilitacoes').select('*').eq('ativo',true)],
  ['programacoes',sb.from('priv_programacoes').select('*').order('ano',{ascending:false}).order('mes',{ascending:false})],
  ['oficiais',sb.from('priv_oficial_itens').select('*').order('data').order('ordem')],
  ['designacoes',sb.from('priv_designacoes').select('*').order('data').order('slot')],
  ['assistencia',sb.from('cv_assistencia_reunioes').select('*').order('ano').order('mes').order('ordem')],
  ['grupos',sb.from('cv_grupos').select('*').eq('ativo',true).order('numero')],
  ['limpeza',sb.from('cv_limpeza').select('*').order('semana_inicio')],
  ['discursos',sb.from('cv_discursos_publicos').select('*').eq('ativo',true).order('secao').order('data').order('ordem')]
 ];
 for(const [k,promise] of jobs){try{const r=await promise;if(!r.error)cache[k]=r.data||[];}catch(e){console.warn(k,e)}}
}

function render(){
 nav();let p=page();
 if(p==='home')renderHome();
 else if(p==='programacao')renderProgramacao();
 else if(p==='meus')renderMeus();
 else if(p==='assistencia')renderAssistencia();
 else if(p==='quadro')renderQuadro();
 else if(p==='privilegios')renderPrivilegios();
 else if(p==='grupos')renderGrupos();
 else if(p==='limpeza')renderLimpeza();
 else if(p==='publicacoes')renderPublicacoes();
 else if(p==='discursos')renderDiscursos();
 else if(p==='pessoas')renderPessoas();
 else if(p==='admin')renderAdmin();
 else location.hash='home';
}
function personName(id){return cache.pessoas.find(x=>Number(x.id)===Number(id))?.nome||'—'}
function funcName(id){return cache.funcoes.find(x=>Number(x.id)===Number(id))?.nome||'—'}
function programLabel(id){const p=cache.programacoes.find(x=>Number(x.id)===Number(id));return p?`${String(p.mes).padStart(2,'0')}/${p.ano} · ${p.status}`:'—'}
function officialForDate(date){return cache.oficiais.filter(x=>isoDate(x.data)===isoDate(date)).sort((a,b)=>Number(a.ordem)-Number(b.ordem))}
function designationRows(){return cache.designacoes.map(d=>({...d,pessoa:personName(d.pessoa_id),funcao:funcName(d.funcao_id)}))}
function futureDesignationsForCurrent(){
 const pid=currentAccess?.pessoa_id;
 let rows=designationRows().filter(d=>d.pessoa_id&&pid&&Number(d.pessoa_id)===Number(pid));
 if(!rows.length&&currentUser?.email){const p=cache.pessoas.find(x=>String(x.email||'').toLowerCase()===String(currentUser.email).toLowerCase());if(p)rows=designationRows().filter(d=>Number(d.pessoa_id)===Number(p.id))}
 return rows.filter(d=>!d.data||isoDate(d.data)>=new Date().toISOString().slice(0,10));
}

function renderHome(){
 const hoje=new Date().toISOString().slice(0,10); const ds=designationRows().filter(x=>x.data&&isoDate(x.data)>=hoje).sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(0,8);
 const mine=futureDesignationsForCurrent().slice(0,5);
 setContent(`<h2>Início</h2><div class="grid">
 <div class="card"><h3>📅 Programação</h3><p>${cache.oficiais.length?`${cache.oficiais.length} item(ns) oficial(is) carregado(s).`:'A base oficial ainda não foi carregada.'}</p><button class="btn" onclick="location.hash='programacao'">Ver programação</button></div>
 <div class="card"><h3>👤 Meus privilégios</h3>${mine.length?mine.map(x=>`<p style="margin:6px 0"><b>${fmtDate(x.data)}</b> · ${esc(x.funcao)}</p>`).join(''):'<p class="muted">Nenhuma designação futura encontrada no seu cadastro.</p>'}<button class="btn" onclick="location.hash='meus'">Abrir</button></div>
 <div class="card"><h3>📋 Próximas designações</h3>${ds.length?ds.slice(0,5).map(x=>`<p style="margin:6px 0"><b>${fmtDate(x.data)}</b> · ${esc(x.funcao)} · ${esc(x.pessoa)}</p>`).join(''):'<p class="muted">Nenhuma designação carregada.</p>'}</div>
 <div class="card"><h3>📚 Publicações</h3><p>Consulta somente leitura do estoque mantido no PVI.</p><button class="btn" onclick="location.hash='publicacoes'">Consultar</button></div>
 </div>`)
}

function renderProgramacao(){
 const dates=[...new Set([...cache.oficiais.map(x=>isoDate(x.data)),...cache.designacoes.map(x=>isoDate(x.data))].filter(Boolean))].sort();
 const pages=[];for(let i=0;i<dates.length;i+=2)pages.push(dates.slice(i,i+2));
 setContent(`<h2>📅 Programação semanal</h2><p class="muted">A programação oficial mantém a numeração recebida. As designações podem ser ajustadas pelo administrador.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('programacao')">🖨️ Imprimir / PDF</button></div>${dates.length?`<div class="program-pages">${pages.map(pg=>`<div class="program-page">${pg.map(d=>programDay(d)).join('')}</div>`).join('')}</div>`:'<div class="card"><b>Nenhuma programação carregada.</b><p class="muted">Quando a base mensal for importada, ela aparecerá aqui.</p></div>'}`)
}
function programDay(d){
 const off=officialForDate(d), ds=designationRows().filter(x=>isoDate(x.data)===d).sort((a,b)=>String(a.funcao||'').localeCompare(String(b.funcao||''),'pt-BR',{sensitivity:'base'})||String(a.pessoa||'').localeCompare(String(b.pessoa||''),'pt-BR',{sensitivity:'base'}));
 return `<section class="week"><div class="week-title">${fmtDate(d)} <span class="week-edit no-print">${canEdit()?`<button class="btn gold" onclick="editDayDesignations('${d}')">✏️ Editar designações</button>`:''}</span></div>${off.map(x=>`<div class="part"><span class="num">${esc(x.ordem)}.</span><span><b>${esc(x.titulo||x.tipo||'Parte')}</b>${x.sala?` · Sala ${esc(x.sala)}`:''}${x.pessoa_nome?`<br>${esc(x.pessoa_nome)}`:''}</span></div>`).join('')||'<div class="part"><span class="muted">Sem itens oficiais para esta data.</span></div>'}${ds.length?`<div class="designation-list"><b>Designações</b>${ds.map(x=>`<span class="badge">${esc(x.funcao)} — ${esc(x.pessoa)}</span>`).join('')}</div>`:''}</section>`
}
function eligiblePeople(funcaoId){
 const hs=new Set(cache.habilitacoes.filter(h=>Number(h.funcao_id)===Number(funcaoId)&&h.ativo).map(h=>Number(h.pessoa_id)));
 return cache.pessoas.filter(p=>p.ativo&&hs.has(Number(p.id))).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR',{sensitivity:'base'}));
}
function editDayDesignations(date){
 if(!canEdit())return;
 const rows=designationRows().filter(x=>isoDate(x.data)===date).sort((a,b)=>Number(a.slot)-Number(b.slot)||String(a.funcao).localeCompare(String(b.funcao),'pt-BR',{sensitivity:'base'}));
 const body=rows.map(x=>{let opts=eligiblePeople(x.funcao_id);if(x.pessoa_id&&!opts.some(p=>Number(p.id)===Number(x.pessoa_id))){const p=cache.pessoas.find(p=>Number(p.id)===Number(x.pessoa_id));if(p)opts=[p,...opts]}return `<div class="edit-desig-row"><div><b>${esc(x.funcao)}</b><small>Slot ${esc(x.slot||'')}</small></div><select class="day-person" data-id="${x.id}"><option value="">— Sem designação —</option>${opts.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(x.pessoa_id)?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>`}).join('');
 document.getElementById('content').insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left;max-height:92vh;overflow:auto"><h2>Editar designações — ${fmtDate(date)}</h2><p class="muted">Escolha o irmão em cada função. O mesmo irmão não pode ficar em duas funções na mesma data.</p>${body||'<p>Nenhuma designação cadastrada para esta data.</p>'}<div class="toolbar"><button class="btn" onclick="saveDayDesignations('${date}')">💾 Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)
}
async function saveDayDesignations(date){
 if(!canEdit())return;
 const rows=[...document.querySelectorAll('.day-person')], vals=rows.map(x=>Number(x.value)||null), nonNull=vals.filter(Boolean);
 if(new Set(nonNull).size!==nonNull.length)return alert('O mesmo irmão não pode ter duas funções na mesma data.');
 for(const r of rows){const q=await sb.from('priv_designacoes').update({pessoa_id:null,alterado_manualmente:true,updated_at:new Date().toISOString()}).eq('id',r.dataset.id);if(q.error)return alert('Erro ao preparar a alteração: '+q.error.message)}
 for(let i=0;i<rows.length;i++){const q=await sb.from('priv_designacoes').update({pessoa_id:vals[i],alterado_manualmente:true,updated_at:new Date().toISOString()}).eq('id',rows[i].dataset.id);if(q.error)return alert('Erro ao salvar a designação: '+q.error.message)}
 document.getElementById('modal')?.remove();await reloadAndRender();
}
function renderAssistencia(){
 const groups={};cache.assistencia.forEach(x=>{const k=`${x.ano}-${String(x.mes).padStart(2,'0')}`;(groups[k]??=[]).push(x)});const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
 const blocos=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([k,rows])=>{const [ano,mes]=k.split('-');rows.sort((a,b)=>Number(a.ordem)-Number(b.ordem));return assistBlock(mes,ano,rows,nomes)}).join('');
 setContent(`<h2>📊 Assistência às reuniões</h2><p class="muted">Tabela mensal. Como administrador, os números podem ser editados diretamente nas células.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('assistencia')">🖨️ Imprimir / PDF</button></div><div class="assist-grid">${blocos||'<div class="card">Nenhum relatório de assistência cadastrado.</div>'}</div>`)
}

function renderDiscursos(){const rec=cache.discursos.filter(x=>x.secao==='RECEBEREMOS'),env=cache.discursos.filter(x=>x.secao==='ENVIAREMOS');setContent(`<h2>🎤 Discursos Públicos</h2><p class="muted">Toque no <b>dia</b> para abrir e editar o registro.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('discursos')">🖨️ Imprimir / PDF</button>${canEdit()?'<button class="btn gold" onclick="newSpeech()">➕ Novo registro</button>':''}</div><div class="discursos-screen">${speechSection('RECEBEREMOS',rec)}<div style="height:22px"></div>${speechSection('ENVIAREMOS',env)}</div><div class="discursos-print-only"><div class="speech-print-head"><div>DISCURSOS PÚBLICOS</div><b>CONGREGAÇÃO VILA INDUSTRIAL</b></div>${speechPrintMonth(rec,'RECEBEREMOS')}${speechPrintMonth(env,'ENVIAREMOS')}</div>`)}
function speechPrintMonth(rows,title){const months={};rows.forEach(x=>{const d=isoDate(x.data);const k=d?d.slice(0,7):'sem-data';(months[k]??=[]).push(x)});return Object.entries(months).sort(([a],[b])=>a.localeCompare(b)).map(([k,rs])=>{const m=k==='sem-data'?0:Number(k.slice(5,7));const mn=m?['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1].toUpperCase():'';return `<section class="speech-print-section"><div class="speech-print-label">${title}</div><table><thead><tr><th>DIA</th><th>SEMANA</th><th>DISCURSO</th><th>ORADOR</th><th>CONGREGAÇÃO</th></tr></thead><tbody>${rs.sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(x=>`<tr><td>${x.data?String(x.data).slice(8,10):''}</td><td>${esc(x.semana||'')}</td><td>${esc(x.discurso||'')}</td><td>${esc(x.orador||'')}</td><td>${esc(x.congregacao||'')}</td></tr>`).join('')}</tbody></table><div class="speech-month-bar">${mn}</div></section>`}).join('')}
function speechSection(title,rows){return `<div class="speech-section print-sheet"><div class="speech-title">${title}</div><div class="speech-table-wrap"><table class="speech-table"><thead><tr><th>DIA</th><th>SEMANA</th><th>DISCURSO</th><th>ORADOR</th><th>CONGREGAÇÃO</th>${canEdit()?'<th class="no-print">Ação</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${canEdit()?`<button type="button" class="date-link" onclick="editSpeech(${x.id})">${fmtDate(x.data)}</button>`:fmtDate(x.data)}</td><td>${esc(x.semana||'')}</td><td>${esc(x.discurso||'')}</td><td>${esc(x.orador||'')}</td><td>${esc(x.congregacao||'')}</td>${canEdit()?`<td class="no-print"><button class="btn light" onclick="editSpeech(${x.id})">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6">Nenhum registro cadastrado.</td></tr>'}</tbody></table></div></div>`}

async function newSpeech(){await speechForm()}
async function editSpeech(id){const x=cache.discursos.find(a=>Number(a.id)===Number(id));if(x)await speechForm(x)}
async function speechForm(x={}){if(!canEdit())return;document.getElementById('content').insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left"><h2>${x.id?'Editar':'Novo'} discurso</h2><label>Seção</label><select id="fs_s"><option ${x.secao==='RECEBEREMOS'?'selected':''}>RECEBEREMOS</option><option ${x.secao==='ENVIAREMOS'?'selected':''}>ENVIAREMOS</option></select><label>Dia</label><input id="fs_d" type="date" value="${isoDate(x.data)}"><label>Semana</label><input id="fs_w" value="${esc(x.semana||'')}"><label>Discurso</label><textarea id="fs_t" rows="3" style="width:100%;padding:10px;border:1px solid #bbb;border-radius:7px">${esc(x.discurso||'')}</textarea><label>Orador</label><input id="fs_o" value="${esc(x.orador||'')}"><label>Congregação</label><input id="fs_c" value="${esc(x.congregacao||'')}"><div class="toolbar"><button class="btn" onclick="saveSpeech(${x.id||'null'})">Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)}
async function saveSpeech(id){const payload={secao:document.getElementById('fs_s').value,data:document.getElementById('fs_d').value||null,semana:document.getElementById('fs_w').value.trim(),discurso:document.getElementById('fs_t').value.trim(),orador:document.getElementById('fs_o').value.trim(),congregacao:document.getElementById('fs_c').value.trim(),ativo:true,updated_at:new Date().toISOString()};let r=id?await sb.from('cv_discursos_publicos').update(payload).eq('id',id):await sb.from('cv_discursos_publicos').insert(payload);if(r.error)return alert(r.error.message);document.getElementById('modal').remove();await reloadAndRender()}

function renderPessoas(){setContent(`<h2>👨‍👩‍👦 Pessoas</h2><p>${roleNotice()}</p><p class="muted">Edite aqui nomes, e-mails e observações. Os privilégios continuam sendo marcados na aba <b>Privilégios</b>.</p><div class="toolbar no-print">${canEdit()?'<button class="btn gold" onclick="newPerson()">➕ Nova pessoa</button>':''}<button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button></div><div class="table-wrap"><table class="table people-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Observação</th>${canEdit()?'<th>Ação</th>':''}</tr></thead><tbody>${cache.pessoas.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.email||'')}</td><td>${esc(p.observacao||'')}</td>${canEdit()?`<td><button class="btn light" onclick="editPerson(${p.id})">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="4">Nenhuma pessoa ativa.</td></tr>'}</tbody></table></div>`)}
async function newPerson(){await personForm({})}
async function editPerson(id){const p=cache.pessoas.find(x=>Number(x.id)===Number(id));if(p)await personForm(p)}
async function personForm(p={}){if(!canEdit())return;document.getElementById('content').insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left"><h2>${p.id?'Editar':'Nova'} pessoa</h2><label>Nome</label><input id="fp_nome" value="${esc(p.nome||'')}"><label>E-mail</label><input id="fp_email" type="email" value="${esc(p.email||'')}"><label>Observação</label><input id="fp_obs" value="${esc(p.observacao||'')}"><div class="toolbar"><button class="btn" onclick="savePerson(${p.id||'null'})">Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)}
async function savePerson(id){const nome=document.getElementById('fp_nome').value.trim(),email=document.getElementById('fp_email').value.trim().toLowerCase(),observacao=document.getElementById('fp_obs').value.trim();if(!nome)return alert('Informe o nome.');const payload={nome,email,observacao,ativo:true,updated_at:new Date().toISOString()};const r=id?await sb.from('priv_pessoas').update(payload).eq('id',id):await sb.from('priv_pessoas').insert(payload);if(r.error)return alert('Erro ao salvar pessoa: '+r.error.message);document.getElementById('modal').remove();await reloadAndRender()}

function renderAdmin(){if(!canEdit()){setContent('<h2>Administração</h2><div class="card">Acesso restrito ao administrador.</div>');return}setContent(`<h2>⚙️ Administração</h2><div class="grid"><div class="card"><h3>🔐 Acessos</h3><input id="newEmail" type="email" placeholder="e-mail" style="width:100%;margin-bottom:8px"><input id="newName" placeholder="nome" style="width:100%;margin-bottom:8px"><select id="newRole" style="width:100%;margin-bottom:8px"><option value="visualizador">Visualizador</option><option value="colaborador">Colaborador</option><option value="administrador">Administrador</option></select><button class="btn" onclick="authorize()">Autorizar / atualizar</button><p id="adminMsg" class="muted"></p></div><div class="card"><h3>📥 Bases mensais</h3><p>As próximas importações serão revisadas antes de publicação.</p><div class="goldbox">A programação oficial deve vir do JW.org. A numeração publicada é preservada.</div></div><div class="card"><h3>🔎 Estado das bases</h3><p>Privilégios: <b>${cache.designacoes.length}</b> designações · <b>${cache.habilitacoes.length}</b> habilitações.</p><p>Programa oficial: <b>${cache.oficiais.length}</b> itens.</p><p>Grupos: <b>${cache.grupos.length}</b> · Limpeza: <b>${cache.limpeza.length}</b> · Discursos: <b>${cache.discursos.length}</b>.</p></div></div>`)}
async function authorize(){let email=document.getElementById('newEmail').value.trim().toLowerCase(),nome=document.getElementById('newName').value.trim(),perfil=document.getElementById('newRole').value;if(!email)return;let r=await sb.from('priv_acessos').upsert({email,nome,perfil,ativo:true},{onConflict:'email'});document.getElementById('adminMsg').textContent=r.error?'Erro: '+r.error.message:'Acesso autorizado/atualizado.'}

async function reloadAndRender(){await loadBase();render()}
document.querySelectorAll('.side button,.mobile-nav button').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.page}));window.addEventListener('hashchange',render);
(async()=>{let s=await sb.auth.getSession();if(s.data.session){currentUser=s.data.session.user;await finishLogin()}})();
</script>
</body></html>
