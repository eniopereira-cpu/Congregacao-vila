<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Congregação Vila</title>
<style>
:root{--nav:#102a57;--purple:#5a155e;--gold:#c99a00;--bg:#f3f5f8;--card:#fff;--text:#17202a;--muted:#68717d;--line:#d9dee5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.app{min-height:100vh;display:flex}.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:0;height:100vh;overflow:auto}.side button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:13px;border-radius:9px;margin:3px 0;cursor:pointer}.side button.active,.side button:hover{background:#eef2f8;font-weight:bold}.main{flex:1;min-width:0}header{background:var(--nav);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:25px}.content{padding:22px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 8px #0000000a}.card h3{margin-top:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--nav);color:#fff;font-weight:bold;cursor:pointer}.btn.gold{background:var(--gold);color:#111}.btn.light{background:#eee;color:#222}.muted{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#e9eef7;margin:2px;font-size:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse}.table th{background:var(--nav);color:#fff;padding:10px;text-align:left}.table td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.week{border:1px solid #b9bec6;background:#fff;margin:18px 0;page-break-inside:avoid}.week-title{background:var(--purple);color:#fff;padding:12px 14px;font-weight:bold}.part{display:flex;gap:14px;padding:9px 12px;border-bottom:1px solid var(--line)}.num{font-weight:bold;min-width:32px}.board{border:3px solid #222;background:#fff}.board .row{display:grid;grid-template-columns:80px 130px 1fr 1fr 1fr 1fr;border-bottom:1px solid #222}.board .row>*{padding:10px;border-right:1px solid #222}.board .head{background:var(--purple);color:#fff;font-weight:bold}.groups .group{border:2px solid #111;margin:12px 0;background:#fff}.groups .ghead{background:var(--nav);color:#fff;padding:9px;font-weight:bold}.groups .gbody{padding:10px}.goldbox{background:#e3dc00;padding:9px;font-weight:bold}.hidden{display:none!important}.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.login-card{background:#fff;width:min(430px,100%);padding:30px;border-radius:18px;box-shadow:0 10px 35px #0002;text-align:center}.login-card h1{margin:6px 0;font-size:30px}.login-card label{display:block;text-align:left;font-weight:bold;margin:14px 0 6px}.login-card input{width:100%;padding:12px;border:1px solid #bbb;border-radius:7px}.login-msg{min-height:24px;margin:12px 0;font-weight:bold}
.mobile-nav{display:none}
@media(max-width:800px){
  .side{display:none}
  header{padding:12px 14px}
  header h1{font-size:21px}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;background:#fff;border-bottom:1px solid var(--line);padding:7px;position:sticky;top:0;z-index:9;-webkit-overflow-scrolling:touch}
  .mobile-nav button{flex:0 0 auto;border:1px solid #d5dbe3;background:#fff;color:var(--text);padding:9px 11px;border-radius:9px;font-weight:600}
  .mobile-nav button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
  .content{padding:14px}
  .board .row{grid-template-columns:55px 85px 1fr}.board .row>*:nth-child(n+4){display:none}
}
@media print{
 @page{size:A4 portrait;margin:6mm}body{background:#fff}.no-print,.side,header{display:none!important}.main{width:100%}.content{padding:0;max-width:none}
 @media print{body[data-print="board"] .content,body[data-print="publicacoes"] .content{font-size:12pt}}
@page{size:A4 portrait;margin:6mm}
@media print{body[data-print="board"]{page-orientation:landscape}}
 .print-landscape{page-break-before:avoid}.week{break-inside:avoid;margin:0 0 8mm}.week-title{font-size:16px}.part{font-size:13px;padding:7px}
 .board{font-size:12px}.board .row{grid-template-columns:55px 75px 1fr 1fr 1fr 1fr}.board .row>*{padding:7px}
}
</style>

<style>
@media print{
  body[data-print="programacao"]{font-size:12pt}
  body[data-print="programacao"] .week{break-inside:avoid;min-height:120mm;margin:0 0 5mm;border:2px solid #111}
  body[data-print="programacao"] .week:nth-of-type(2n+1){break-before:page}
  body[data-print="programacao"] .week:nth-of-type(1){break-before:auto}
  body[data-print="programacao"] .week-title{background:#102a57;font-size:16pt;text-align:center;padding:7mm}
  body[data-print="programacao"] .part{font-size:12pt;padding:5mm 4mm}
  body[data-print="grupos"]{page-orientation:landscape}
  body[data-print="grupos"] .content{padding:0}
  body[data-print="grupos"] .groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2mm;align-items:stretch}
  body[data-print="grupos"] .group{margin:0;border:1.5px solid #111;break-inside:avoid;min-width:0}
  body[data-print="grupos"] .ghead{text-align:center;font-size:11pt;padding:3mm}
  body[data-print="grupos"] .gbody{font-size:9pt;padding:3mm;overflow-wrap:anywhere;word-break:normal;line-height:1.18}
  body[data-print="grupos"] .gbody hr{margin:2mm 0}
  body[data-print="publicacoes"] .table{table-layout:fixed}
  body[data-print="publicacoes"] .table th,body[data-print="publicacoes"] .table td{font-size:12pt;padding:6px;vertical-align:middle}
  body[data-print="publicacoes"] .table th:nth-child(1),body[data-print="publicacoes"] .table td:nth-child(1){width:18%}
  body[data-print="publicacoes"] .table th:nth-child(2),body[data-print="publicacoes"] .table td:nth-child(2){width:52%}
  body[data-print="publicacoes"] .table th:nth-child(3),body[data-print="publicacoes"] .table td:nth-child(3){width:12%;text-align:center}
  body[data-print="publicacoes"] .table th:nth-child(4),body[data-print="publicacoes"] .table td:nth-child(4){width:18%;text-align:center}
  body[data-print="assistencia"]{page-orientation:landscape}
  body[data-print="assistencia"] .assist-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
  body[data-print="assistencia"] .assist-block{break-inside:avoid;border:1px solid #222}
  body[data-print="assistencia"] .assist-title{text-align:center;font-size:12pt;font-weight:bold;padding:3mm;border-bottom:1px solid #222}
  body[data-print="assistencia"] .assist-table{width:100%;border-collapse:collapse;table-layout:fixed}
  body[data-print="assistencia"] .assist-table th,body[data-print="assistencia"] .assist-table td{border:1px solid #777;text-align:center;padding:2.5mm;font-size:8.5pt}
  body[data-print="assistencia"] .assist-table th:first-child{width:31%;text-align:center}
}

@media print{body[data-print="board"] .board{font-size:14pt}body[data-print="board"] .board .row{grid-template-columns:55px 65px 1fr 1fr 70px 90px}body[data-print="board"] .board .row>*{padding:8px}body[data-print="publicacoes"] .table th,body[data-print="publicacoes"] .table td{font-size:12pt;padding:7px}body[data-print="grupos"] .group{break-inside:avoid}body[data-print="discursos"] .board .row{grid-template-columns:75px 100px 1fr 1fr 1fr 40px}.login{overflow:auto}.login-card input,.login-card select{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;margin-bottom:4px}</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div style="font-size:42px">🏛️</div><h1>Congregação Vila</h1>
    <p class="muted">Acesso por e-mail</p>
    <div id="login1"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com">
      <button class="btn" style="width:100%;margin-top:12px" onclick="sendCode()">Enviar código</button></div>
    <div id="login2" class="hidden"><p>Código enviado para <b id="sent"></b>.</p><label>Código</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code"><button class="btn" style="width:100%;margin-top:12px" onclick="verifyCode()">Entrar</button>
      <button class="btn light" style="width:100%;margin-top:8px" onclick="backLogin()">Trocar e-mail</button></div>
    <div id="loginMsg" class="login-msg"></div><small class="muted">Somente e-mails autorizados pelo administrador entram.</small>
  </div>
</div>

<div class="app hidden" id="appShell">
<aside class="side">
  <button data-page="home">🏠 Início</button><button data-page="programacao">📅 Programação</button>
  <button data-page="meus">👤 Meus privilégios</button><button data-page="assistencia">📊 Assistência</button><button data-page="quadro">📋 Quadro</button>
  <button data-page="privilegios">🎯 Privilégios</button><button data-page="grupos">👥 Grupos</button>
  <button data-page="limpeza">🧹 Limpeza</button><button data-page="publicacoes">📚 Publicações</button><button data-page="discursos">🎤 Discursos Públicos</button>
  <button data-page="pessoas">👨‍👩‍👦 Pessoas</button><button data-page="admin" id="adminNav">⚙️ Administração</button>
</aside>
<main class="main">
<header><h1>Congregação Vila</h1><div style="display:flex;align-items:center;gap:10px"><span id="userLabel"></span><button class="btn light no-print" onclick="logout()">Sair</button></div></header>
<div class="mobile-nav no-print" id="mobileNav">
  <button data-page="home">🏠 Início</button><button data-page="programacao">📅 Programação</button>
  <button data-page="meus">👤 Meus privilégios</button><button data-page="assistencia">📊 Assistência</button><button data-page="quadro">📋 Quadro</button>
  <button data-page="privilegios">🎯 Privilégios</button><button data-page="grupos">👥 Grupos</button><button data-page="limpeza">🧹 Limpeza</button>
  <button data-page="publicacoes">📚 Publicações</button><button data-page="discursos">🎤 Discursos Públicos</button><button data-page="pessoas">👨‍👩‍👦 Pessoas</button><button data-page="admin" id="mobileAdminNav">⚙️ Administração</button>
</div>
<div class="content" id="content"></div>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<script>
const SUPABASE_URL='https://somxvqwpqhnxjxavhwvb.supabase.co';
const SUPABASE_KEY='sb_publishable_c1qfUYeooWwsvcHF0_7Rfw_PwKk2PSp';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentAccess=null;
let cache={pessoas:[],funcoes:[],habilitacoes:[],programacoes:[],oficiais:[],designacoes:[],grupos:[],limpeza:[],discursos:[]};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(v){if(!v)return '—'; const [y,m,d]=String(v).slice(0,10).split('-'); return d&&m&&y?`${d}/${m}/${y}`:String(v)}
function isoDate(v){return v?String(v).slice(0,10):''}
function msg(t){document.getElementById('loginMsg').textContent=t}
function page(){return location.hash.slice(1)||'home'}
function nav(){document.querySelectorAll('.side button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page()));document.getElementById('mobileAdminNav')?.classList.toggle('hidden',currentAccess?.perfil!=='administrador')}
function canEdit(){return currentAccess?.perfil==='administrador'}
function printIt(type){document.body.dataset.print=type;window.print();setTimeout(()=>delete document.body.dataset.print,700)}
function roleNotice(){return canEdit()?'<span class="badge">Administrador: edição liberada</span>':'<span class="badge">Somente visualização e impressão</span>'}
function setContent(html){document.getElementById('content').innerHTML=html}
function statusLine(t){return `<div class="muted" style="margin:10px 0">${esc(t)}</div>`}

async function sendCode(){let e=document.getElementById('email').value.trim().toLowerCase();if(!e)return msg('Digite seu e-mail.');msg('Enviando...');let r=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});if(r.error)return msg(r.error.message);document.getElementById('sent').textContent=e;document.getElementById('login1').classList.add('hidden');document.getElementById('login2').classList.remove('hidden');msg('Código enviado.')}
async function verifyCode(){let e=document.getElementById('email').value.trim().toLowerCase(),t=document.getElementById('code').value.trim();if(!t)return msg('Digite o código.');msg('Validando...');let r=await sb.auth.verifyOtp({email:e,token:t,type:'email'});if(r.error)return msg(r.error.message);currentUser=r.data.user;await finishLogin()}
function backLogin(){document.getElementById('login2').classList.add('hidden');document.getElementById('login1').classList.remove('hidden');msg('')}
async function finishLogin(){
 if(!currentUser)return;
 let q=await sb.from('priv_acessos').select('*').eq('email',currentUser.email).eq('ativo',true).limit(1).maybeSingle();
 let access=q.data;
 if(!access){let p=await sb.from('perfis_usuarios').select('*').eq('user_id',currentUser.id).eq('ativo',true).maybeSingle();if(p.data)access={...p.data,email:currentUser.email}}
 if(!access){await sb.auth.signOut();msg('Seu e-mail ainda não foi liberado pelo administrador.');return}
 currentAccess=access;document.getElementById('login').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');
 document.getElementById('userLabel').textContent=(access.nome||currentUser.email)+' · '+(access.perfil||'visualizador');
 document.getElementById('adminNav').classList.toggle('hidden',access.perfil!=='administrador');document.getElementById('mobileAdminNav')?.classList.toggle('hidden',access.perfil!=='administrador');
 await loadBase();render();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function loadBase(){
 const jobs=[
  ['pessoas',sb.from('priv_pessoas').select('*').eq('ativo',true).order('nome')],
  ['funcoes',sb.from('priv_funcoes').select('*').eq('ativo',true).order('nome')],
  ['habilitacoes',sb.from('priv_habilitacoes').select('*').eq('ativo',true)],
  ['programacoes',sb.from('priv_programacoes').select('*').order('ano',{ascending:false}).order('mes',{ascending:false})],
  ['oficiais',sb.from('priv_oficial_itens').select('*').order('data').order('ordem')],
  ['designacoes',sb.from('priv_designacoes').select('*').order('data').order('slot')],
  ['assistencia',sb.from('cv_assistencia_reunioes').select('*').order('ano').order('mes').order('ordem')],
  ['grupos',sb.from('cv_grupos').select('*').eq('ativo',true).order('numero')],
  ['limpeza',sb.from('cv_limpeza').select('*').order('semana_inicio')],
  ['discursos',sb.from('cv_discursos_publicos').select('*').eq('ativo',true).order('secao').order('data').order('ordem')]
 ];
 for(const [k,promise] of jobs){try{const r=await promise;if(!r.error)cache[k]=r.data||[];}catch(e){console.warn(k,e)}}
}

function render(){
 nav();let p=page();
 if(p==='home')renderHome();
 else if(p==='programacao')renderProgramacao();
 else if(p==='meus')renderMeus();
 else if(p==='assistencia')renderAssistencia();
 else if(p==='quadro')renderQuadro();
 else if(p==='privilegios')renderPrivilegios();
 else if(p==='grupos')renderGrupos();
 else if(p==='limpeza')renderLimpeza();
 else if(p==='publicacoes')renderPublicacoes();
 else if(p==='discursos')renderDiscursos();
 else if(p==='pessoas')renderPessoas();
 else if(p==='admin')renderAdmin();
 else location.hash='home';
}
function personName(id){return cache.pessoas.find(x=>Number(x.id)===Number(id))?.nome||'—'}
function funcName(id){return cache.funcoes.find(x=>Number(x.id)===Number(id))?.nome||'—'}
function programLabel(id){const p=cache.programacoes.find(x=>Number(x.id)===Number(id));return p?`${String(p.mes).padStart(2,'0')}/${p.ano} · ${p.status}`:'—'}
function officialForDate(date){return cache.oficiais.filter(x=>isoDate(x.data)===isoDate(date)).sort((a,b)=>Number(a.ordem)-Number(b.ordem))}
function designationRows(){return cache.designacoes.map(d=>({...d,pessoa:personName(d.pessoa_id),funcao:funcName(d.funcao_id)}))}
function futureDesignationsForCurrent(){
 const pid=currentAccess?.pessoa_id;
 let rows=designationRows().filter(d=>d.pessoa_id&&pid&&Number(d.pessoa_id)===Number(pid));
 if(!rows.length&&currentUser?.email){const p=cache.pessoas.find(x=>String(x.email||'').toLowerCase()===String(currentUser.email).toLowerCase());if(p)rows=designationRows().filter(d=>Number(d.pessoa_id)===Number(p.id))}
 return rows.filter(d=>!d.data||isoDate(d.data)>=new Date().toISOString().slice(0,10));
}

function renderHome(){
 const hoje=new Date().toISOString().slice(0,10); const ds=designationRows().filter(x=>x.data&&isoDate(x.data)>=hoje).sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(0,8);
 const mine=futureDesignationsForCurrent().slice(0,5);
 setContent(`<h2>Início</h2><div class="grid">
 <div class="card"><h3>📅 Programação</h3><p>${cache.oficiais.length?`${cache.oficiais.length} item(ns) oficial(is) carregado(s).`:'A base oficial ainda não foi carregada.'}</p><button class="btn" onclick="location.hash='programacao'">Ver programação</button></div>
 <div class="card"><h3>👤 Meus privilégios</h3>${mine.length?mine.map(x=>`<p style="margin:6px 0"><b>${fmtDate(x.data)}</b> · ${esc(x.funcao)}</p>`).join(''):'<p class="muted">Nenhuma designação futura encontrada no seu cadastro.</p>'}<button class="btn" onclick="location.hash='meus'">Abrir</button></div>
 <div class="card"><h3>📋 Próximas designações</h3>${ds.length?ds.slice(0,5).map(x=>`<p style="margin:6px 0"><b>${fmtDate(x.data)}</b> · ${esc(x.funcao)} · ${esc(x.pessoa)}</p>`).join(''):'<p class="muted">Nenhuma designação carregada.</p>'}</div>
 <div class="card"><h3>📚 Publicações</h3><p>Consulta somente leitura do estoque mantido no PVI.</p><button class="btn" onclick="location.hash='publicacoes'">Consultar</button></div>
 </div>`)
}

function renderProgramacao(){
 const dates=[...new Set([...cache.oficiais.map(x=>isoDate(x.data)),...cache.designacoes.map(x=>isoDate(x.data))].filter(Boolean))].sort();
 setContent(`<h2>📅 Programação semanal</h2><p class="muted">Os itens oficiais são carregados da base oficial. A numeração é exibida exatamente pelo campo de ordem recebido; o aplicativo não inventa nem renumera partes.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('programacao')">🖨️ Imprimir / PDF</button></div>${dates.length?dates.map(d=>programDay(d)).join(''):'<div class="card"><b>Nenhuma programação oficial foi carregada ainda.</b><p class="muted">Quando a base mensal for importada, ela aparecerá aqui junto das designações.</p></div>'}`)
}
function programDay(d){
 const off=officialForDate(d), ds=designationRows().filter(x=>isoDate(x.data)===d).sort((a,b)=>String(a.pessoa||"").localeCompare(String(b.pessoa||""),"pt-BR",{sensitivity:"base"})||String(a.funcao||"").localeCompare(String(b.funcao||""),"pt-BR",{sensitivity:"base"}));
 return `<section class="week"><div class="week-title">${fmtDate(d)}</div>${off.map(x=>`<div class="part"><span class="num">${esc(x.ordem)}.</span><span><b>${esc(x.titulo||x.tipo||'Parte')}</b>${x.sala?` · Sala ${esc(x.sala)}`:''}${x.pessoa_nome?`<br>${esc(x.pessoa_nome)}`:''}</span></div>`).join('')||'<div class="part"><span class="muted">Sem itens oficiais para esta data.</span></div>'}${ds.length?`<div style="padding:10px 12px;background:#f5f6f8"><b>Designações:</b><br>${ds.map(x=>`<span class="badge">${esc(x.funcao)} — ${esc(x.pessoa)}</span>`).join('')}</div>`:''}</section>`
}

function renderAssistencia(){
 const groups={};
 cache.assistencia.forEach(x=>{const k=`${x.ano}-${String(x.mes).padStart(2,'0')}`;(groups[k]??=[]).push(x)});
 const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
 const blocos=Object.entries(groups).map(([k,rows])=>{const [ano,mes]=k.split('-');rows.sort((a,b)=>Number(a.ordem)-Number(b.ordem));return `<section class="assist-block"><div class="assist-title">Relatório de Assistência às Reuniões<br><b>${nomes[Number(mes)-1].toUpperCase()} ${ano}</b></div><table class="assist-table"><thead><tr><th></th>${rows.map(r=>`<th>${fmtDate(r.data).slice(0,5).replace('/','/')}</th>`).join('')}</tr></thead><tbody><tr><th>Meio da Semana<br><b>Presencial</b></th>${rows.map(r=>`<td>${r.tipo_reuniao==='meio_semana'?Number(r.meio_semana_presencial)||0:''}</td>`).join('')}</tr><tr><th>Meio da Semana<br><b>Vídeo conferência</b></th>${rows.map(r=>`<td>${r.tipo_reuniao==='meio_semana'?Number(r.meio_semana_video)||0:''}</td>`).join('')}</tr><tr><th>Fim de semana<br><b>Presencial</b></th>${rows.map(r=>`<td>${r.tipo_reuniao==='fim_semana'?Number(r.fim_semana_presencial)||0:''}</td>`).join('')}</tr><tr><th>Fim de semana<br><b>Vídeo conferência</b></th>${rows.map(r=>`<td>${r.tipo_reuniao==='fim_semana'?Number(r.fim_semana_video)||0:''}</td>`).join('')}</tr></tbody></table></section>`}).join('');
 setContent(`<h2>📊 Assistência às reuniões</h2><p class="muted">Relatório mensal conforme o padrão definido para impressão.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('assistencia')">🖨️ Imprimir / PDF</button></div><div class="assist-grid">${blocos||'<div class="card">Nenhum relatório de assistência cadastrado.</div>'}</div>`)
}

function renderMeus(){
 const rows=futureDesignationsForCurrent();
 setContent(`<h2>👤 Meus privilégios</h2><p>${roleNotice()}</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('meus')">🖨️ Imprimir / PDF</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Função</th><th>Programa</th><th>Alteração</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${fmtDate(x.data)}</td><td><b>${esc(x.funcao)}</b></td><td>${esc(programLabel(x.programacao_id))}</td><td>${x.alterado_manualmente?'Manual':'Rodízio'}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma designação futura encontrada.</td></tr>'}</tbody></table></div>`)
}
function renderQuadro(){
 const rows=designationRows().filter(x=>x.data);
 setContent(`<h2>📋 Quadro de designações</h2><p class="muted">Quadro baseado nas designações registradas na base. Para impressão oficial, use A4 e confira a pré-visualização.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('board')">🖨️ Imprimir quadro / PDF</button></div><div class="board print-sheet"><div class="row head"><span>DATA</span><span>PARTE</span><span>DESIGNAÇÃO</span><span>ORADOR/ALUNO</span><span>SALA</span><span>OBS.</span></div>${rows.map(x=>`<div class="row"><span>${fmtDate(x.data)}</span><span>${esc(x.slot)}</span><span>${esc(x.funcao)}</span><span>${esc(x.pessoa)}</span><span>${esc(cache.oficiais.find(o=>isoDate(o.data)===isoDate(x.data)&&Number(o.pessoa_id)===Number(x.pessoa_id))?.sala||'')}</span><span>${x.alterado_manualmente?'Manual':''}</span></div>`).join('')||'<div style="padding:18px">Nenhuma designação carregada.</div>'}</div>`)
}
function renderPrivilegios(){
 setContent(`<h2>🎯 Privilégios e habilitações</h2><p>${roleNotice()}</p><p class="muted">A habilitação é a base usada para o rodízio. Pessoas sem habilitação ativa não devem ser escolhidas automaticamente para a função.</p><div class="table-wrap"><table class="table"><thead><tr><th>Pessoa</th><th>Habilitações ativas</th></tr></thead><tbody>${cache.pessoas.map(p=>{const hs=cache.habilitacoes.filter(h=>Number(h.pessoa_id)===Number(p.id)).map(h=>funcName(h.funcao_id));return `<tr><td><b>${esc(p.nome)}</b></td><td>${hs.map(esc).join(' · ')||'—'}</td></tr>`}).join('')}</tbody></table></div>`)
}

function renderGrupos(){
 setContent(`<h2>👥 Grupos</h2><p class="muted">Dados mantidos na base Congregação Vila. Visualização e impressão não alteram dados.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('grupos')">🖨️ Imprimir grupos / PDF</button>${canEdit()?'<button class="btn gold" onclick="newGroup()">➕ Novo grupo</button>':''}</div><div class="groups">${cache.grupos.map(g=>groupCard(g)).join('')||'<div class="card">Nenhum grupo foi cadastrado ainda.</div>'}</div>`)
}
function groupCard(g){return `<div class="group"><div class="ghead">GRUPO ${String(g.numero).padStart(2,'0')}${g.nome?' — '+esc(g.nome):''}</div><div class="gbody"><b>Ancião responsável:</b> ${esc(g.anciao_responsavel||'—')}<br><b>Servo:</b> ${esc(g.servo||'—')}<br><b>Ajudantes:</b> ${esc(g.ajudantes||'—')}<hr><b>Integrantes:</b><br>${esc(g.integrantes||'—')}${canEdit()?`<div class="toolbar no-print"><button class="btn light" onclick="editGroup(${g.id})">Editar</button><button class="btn light" onclick="deleteGroup(${g.id})">Excluir</button></div>`:''}</div></div>`}
async function newGroup(){await groupForm()}
async function editGroup(id){const g=cache.grupos.find(x=>Number(x.id)===Number(id));if(g)await groupForm(g)}
async function groupForm(g={}){if(!canEdit())return;const c=document.getElementById('content');c.insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left"><h2>${g.id?'Editar':'Novo'} grupo</h2><label>Número</label><input id="fg_num" type="number" min="1" max="5" value="${g.numero||''}"><label>Nome</label><input id="fg_nome" value="${esc(g.nome||'')}"><label>Ancião responsável</label><input id="fg_anc" value="${esc(g.anciao_responsavel||'')}"><label>Servo</label><input id="fg_servo" value="${esc(g.servo||'')}"><label>Ajudantes</label><input id="fg_aj" value="${esc(g.ajudantes||'')}"><label>Integrantes</label><input id="fg_int" value="${esc(g.integrantes||'')}"><div class="toolbar"><button class="btn" onclick="saveGroup(${g.id||'null'})">Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)}
async function saveGroup(id){const payload={numero:Number(document.getElementById('fg_num').value),nome:document.getElementById('fg_nome').value.trim(),anciao_responsavel:document.getElementById('fg_anc').value.trim(),servo:document.getElementById('fg_servo').value.trim(),ajudantes:document.getElementById('fg_aj').value.trim(),integrantes:document.getElementById('fg_int').value.trim(),updated_at:new Date().toISOString()};let r=id?await sb.from('cv_grupos').update(payload).eq('id',id):await sb.from('cv_grupos').insert(payload);if(r.error)return alert(r.error.message);document.getElementById('modal').remove();await reloadAndRender()}
async function deleteGroup(id){if(!canEdit()||!confirm('Excluir este grupo?'))return;let r=await sb.from('cv_grupos').update({ativo:false,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await reloadAndRender()}

function renderLimpeza(){
 setContent(`<h2>🧹 Arranjo de limpeza</h2><p class="muted">Rodízio semanal conforme a base cadastrada.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('limpeza')">🖨️ Imprimir / PDF</button>${canEdit()?'<button class="btn gold" onclick="newCleaning()">➕ Nova semana</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Semana</th><th>Grupo</th><th>Ancião responsável</th><th>Observação</th>${canEdit()?'<th></th>':''}</tr></thead><tbody>${cache.limpeza.map(x=>`<tr><td>${fmtDate(x.semana_inicio)} a ${fmtDate(x.semana_fim)}</td><td>${x.grupo_numero??'—'}</td><td>${esc(x.anciao_responsavel||'—')}</td><td>${esc(x.observacao||'')}</td>${canEdit()?`<td><button class="btn light" onclick="editCleaning(${x.id})">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="5">Nenhum arranjo cadastrado.</td></tr>'}</tbody></table></div>`)
}
async function newCleaning(){await cleaningForm()}
async function editCleaning(id){const x=cache.limpeza.find(a=>Number(a.id)===Number(id));if(x)await cleaningForm(x)}
async function cleaningForm(x={}){if(!canEdit())return;document.getElementById('content').insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left"><h2>${x.id?'Editar':'Nova'} semana de limpeza</h2><label>Início</label><input id="fl_i" type="date" value="${isoDate(x.semana_inicio)}"><label>Fim</label><input id="fl_f" type="date" value="${isoDate(x.semana_fim)}"><label>Grupo</label><input id="fl_g" type="number" min="1" max="5" value="${x.grupo_numero??''}"><label>Ancião responsável</label><input id="fl_a" value="${esc(x.anciao_responsavel||'')}"><label>Observação</label><input id="fl_o" value="${esc(x.observacao||'')}"><div class="toolbar"><button class="btn" onclick="saveCleaning(${x.id||'null'})">Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)}
async function saveCleaning(id){const payload={semana_inicio:document.getElementById('fl_i').value,semana_fim:document.getElementById('fl_f').value,grupo_numero:Number(document.getElementById('fl_g').value)||null,anciao_responsavel:document.getElementById('fl_a').value.trim(),observacao:document.getElementById('fl_o').value.trim()};let r=id?await sb.from('cv_limpeza').update(payload).eq('id',id):await sb.from('cv_limpeza').insert(payload);if(r.error)return alert(r.error.message);document.getElementById('modal').remove();await reloadAndRender()}

function renderPublicacoes(){
 setContent(`<h2>📚 Publicações</h2><p class="muted">Consulta somente leitura do estoque mantido no PVI — Controle de Publicações. <b>O Congregação Vila não altera nenhum dado do PVI.</b></p><div class="toolbar no-print"><button class="btn" onclick="loadPublicacoes()">🔄 Atualizar</button><button class="btn light" onclick="printIt('publicacoes')">🖨️ Imprimir / PDF</button><input id="pubBusca" placeholder="Pesquisar por código ou nome" style="min-width:260px;padding:10px;border:1px solid #bbb;border-radius:8px"></div><div id="pubStatus" class="muted">Carregando dados do PVI...</div><div id="pubTable"></div>`);
 document.getElementById('pubBusca').addEventListener('input',()=>renderPubRows(cache._publicacoes||[]));loadPublicacoes();
}
async function loadPublicacoes(){const st=document.getElementById('pubStatus'),box=document.getElementById('pubTable');if(!box)return;st.textContent='Atualizando estoque do PVI...';let q=await sb.from('publicacoes').select('codigo,name,ano,quantidade_atual,ativo').eq('ativo',true).order('codigo',{ascending:true});if(q.error){st.textContent='Não foi possível consultar o PVI: '+q.error.message;box.innerHTML='';return}cache._publicacoes=q.data||[];renderPubRows(cache._publicacoes)}
function renderPubRows(all){const busca=(document.getElementById('pubBusca')?.value||'').trim().toLowerCase();const rows=all.filter(x=>!busca||String(x.codigo||'').toLowerCase().includes(busca)||String(x.name||'').toLowerCase().includes(busca)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base'})||String(a.codigo||'').localeCompare(String(b.codigo||''),'pt-BR',{numeric:true,sensitivity:'base'}));document.getElementById('pubStatus').textContent=`${rows.length} publicação(ões) ativa(s) · dados do PVI · atualizado agora`;document.getElementById('pubTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Publicação</th><th>Ano</th><th style="text-align:center">Quantidade</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.codigo)}</b></td><td>${esc(x.name)}</td><td>${x.ano??'—'}</td><td style="font-size:20px;font-weight:bold;text-align:center;vertical-align:middle">${Number.isFinite(Number(x.quantidade_atual))?Number(x.quantidade_atual):0}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma publicação encontrada.</td></tr>'}</tbody></table></div>`}

function renderDiscursos(){
 const rec=cache.discursos.filter(x=>x.secao==='RECEBEREMOS'),env=cache.discursos.filter(x=>x.secao==='ENVIAREMOS');
 setContent(`<h2>🎤 Discursos Públicos</h2><p class="muted">Estrutura conforme o modelo mensal: Dia · Semana · Discurso · Orador · Congregação.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('discursos')">🖨️ Imprimir / PDF</button>${canEdit()?'<button class="btn gold" onclick="newSpeech()">➕ Novo registro</button>':''}</div>${speechSection('RECEBEREMOS',rec)}<div style="height:30px"></div>${speechSection('ENVIAREMOS',env)}`)
}
function speechSection(title,rows){return `<div class="board print-sheet"><h3 style="text-align:center">${title}</h3><div class="row head"><span>DIA</span><span>SEMANA</span><span>DISCURSO</span><span>ORADOR</span><span>CONGREGAÇÃO</span><span></span></div>${rows.map(x=>`<div class="row"><span>${fmtDate(x.data)}</span><span>${esc(x.semana||'')}</span><span>${esc(x.discurso||'')}</span><span>${esc(x.orador||'')}</span><span>${esc(x.congregacao||'')}</span><span>${canEdit()?`<button class="btn light no-print" onclick="editSpeech(${x.id})">Editar</button>`:''}</span></div>`).join('')||'<div style="padding:15px">Nenhum registro cadastrado.</div>'}</div>`}
async function newSpeech(){await speechForm()}
async function editSpeech(id){const x=cache.discursos.find(a=>Number(a.id)===Number(id));if(x)await speechForm(x)}
async function speechForm(x={}){if(!canEdit())return;document.getElementById('content').insertAdjacentHTML('afterbegin',`<div id="modal" class="login" style="z-index:100"><div class="login-card" style="text-align:left"><h2>${x.id?'Editar':'Novo'} discurso</h2><label>Seção</label><select id="fs_s"><option ${x.secao==='RECEBEREMOS'?'selected':''}>RECEBEREMOS</option><option ${x.secao==='ENVIAREMOS'?'selected':''}>ENVIAREMOS</option></select><label>Dia</label><input id="fs_d" type="date" value="${isoDate(x.data)}"><label>Semana</label><input id="fs_w" value="${esc(x.semana||'')}"><label>Discurso</label><input id="fs_t" value="${esc(x.discurso||'')}"><label>Orador</label><input id="fs_o" value="${esc(x.orador||'')}"><label>Congregação</label><input id="fs_c" value="${esc(x.congregacao||'')}"><div class="toolbar"><button class="btn" onclick="saveSpeech(${x.id||'null'})">Salvar</button><button class="btn light" onclick="document.getElementById('modal').remove()">Cancelar</button></div></div></div>`)}
async function saveSpeech(id){const payload={secao:document.getElementById('fs_s').value,data:document.getElementById('fs_d').value||null,semana:document.getElementById('fs_w').value.trim(),discurso:document.getElementById('fs_t').value.trim(),orador:document.getElementById('fs_o').value.trim(),congregacao:document.getElementById('fs_c').value.trim(),updated_at:new Date().toISOString()};let r=id?await sb.from('cv_discursos_publicos').update(payload).eq('id',id):await sb.from('cv_discursos_publicos').insert(payload);if(r.error)return alert(r.error.message);document.getElementById('modal').remove();await reloadAndRender()}

function renderPessoas(){setContent(`<h2>👨‍👩‍👦 Pessoas</h2><p>${roleNotice()}</p><p class="muted">Cadastro usado pela base de privilégios. A edição ficará restrita às telas administrativas definidas.</p><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Observação</th></tr></thead><tbody>${cache.pessoas.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.email||'')}</td><td>${esc(p.observacao||'')}</td></tr>`).join('')||'<tr><td colspan="3">Nenhuma pessoa ativa.</td></tr>'}</tbody></table></div>`)}

function renderAdmin(){if(!canEdit()){setContent('<h2>Administração</h2><div class="card">Acesso restrito ao administrador.</div>');return}setContent(`<h2>⚙️ Administração</h2><div class="grid"><div class="card"><h3>🔐 Acessos</h3><input id="newEmail" type="email" placeholder="e-mail" style="width:100%;margin-bottom:8px"><input id="newName" placeholder="nome" style="width:100%;margin-bottom:8px"><select id="newRole" style="width:100%;margin-bottom:8px"><option value="visualizador">Visualizador</option><option value="colaborador">Colaborador</option><option value="administrador">Administrador</option></select><button class="btn" onclick="authorize()">Autorizar / atualizar</button><p id="adminMsg" class="muted"></p></div><div class="card"><h3>📥 Bases mensais</h3><p>As próximas importações serão revisadas antes de publicação.</p><div class="goldbox">A programação oficial deve vir do JW.org. A numeração publicada é preservada.</div></div><div class="card"><h3>🔎 Estado das bases</h3><p>Privilégios: <b>${cache.designacoes.length}</b> designações · <b>${cache.habilitacoes.length}</b> habilitações.</p><p>Programa oficial: <b>${cache.oficiais.length}</b> itens.</p><p>Grupos: <b>${cache.grupos.length}</b> · Limpeza: <b>${cache.limpeza.length}</b> · Discursos: <b>${cache.discursos.length}</b>.</p></div></div>`)}
async function authorize(){let email=document.getElementById('newEmail').value.trim().toLowerCase(),nome=document.getElementById('newName').value.trim(),perfil=document.getElementById('newRole').value;if(!email)return;let r=await sb.from('priv_acessos').upsert({email,nome,perfil,ativo:true},{onConflict:'email'});document.getElementById('adminMsg').textContent=r.error?'Erro: '+r.error.message:'Acesso autorizado/atualizado.'}

async function reloadAndRender(){await loadBase();render()}
document.querySelectorAll('.side button,.mobile-nav button').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.page}));window.addEventListener('hashchange',render);
(async()=>{let s=await sb.auth.getSession();if(s.data.session){currentUser=s.data.session.user;await finishLogin()}})();
</script>
</body></html>
