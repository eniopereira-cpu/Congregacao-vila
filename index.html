async function loadBase(){
 const jobs=[
  ['pessoas',sb.from('priv_pessoas').select('*').eq('ativo',true).order('nome')],
  ['funcoes',sb.from('priv_funcoes').select('*').eq('ativo',true).order('nome')],
  ['habilitacoes',sb.from('priv_habilitacoes').select('*').eq('ativo',true)],
  ['programacoes',sb.from('priv_programacoes').select('*').order('ano',{ascending:false}).order('mes',{ascending:false})],
  ['oficiais',sb.from('priv_oficial_itens').select('*').order('data').order('ordem')],
  ['designacoes',sb.from('priv_designacoes').select('*').order('data').order('slot')],
  ['assistencia',sb.from('cv_assistencia_reunioes').select('*').order('ano').order('mes').order('ordem')],
  ['grupos',sb.from('cv_grupos').select('*').eq('ativo',true).order('numero')],
  ['limpeza',sb.from('cv_limpeza').select('*').order('semana_inicio')],
  ['discursos',sb.from('cv_discursos_publicos').select('*').eq('ativo',true).order('secao').order('data').order('ordem')]
 ];
 const results=await Promise.allSettled(jobs.map(x=>x[1]));
 results.forEach((res,i)=>{const k=jobs[i][0];if(res.status==='fulfilled' && !res.value.error)cache[k]=res.value.data||[];else if(res.status==='rejected')console.warn(k,res.reason);else if(res.value.error)console.warn(k,res.value.error)});
 // A primeira planilha do Quadro de Anuncio.xlsx é a fonte oficial dos cinco grupos.
 // Se a tabela ainda estiver vazia, grava os cinco grupos na base para que também possam ser editados depois.
 if(!cache.grupos.length){
   const seed=GROUPS_PLANILHA.map(g=>({...g,ativo:true,updated_at:new Date().toISOString()}));
   try{
     const r=await sb.from('cv_grupos').upsert(seed,{onConflict:'numero'});
     if(!r.error){const q=await sb.from('cv_grupos').select('*').eq('ativo',true).order('numero');if(!q.error)cache.grupos=q.data||[]}
     else cache.grupos=seed.map((g,i)=>({...g,id:-(i+1),placeholder:false}));
   }catch(e){cache.grupos=seed.map((g,i)=>({...g,id:-(i+1),placeholder:false}));console.warn('seed grupos',e)}
 }
}

 const screen=cache.limpeza.map(x=>`<tr><td>${fmtDate(x.semana_inicio)} a ${fmtDate(x.semana_fim)}</td><td>${x.grupo_numero??'—'}</td><td>${esc(x.anciao_responsavel||'—')}</td><td>${esc(x.observacao||'')}</td>${canEdit()?`<td><button class="btn light" onclick="editCleaning(${x.id})">Editar</button></td>`:''}</tr>`).join('');

}

function renderPublicacoes(){
 setContent(`<h2>📚 Publicações</h2><p class="muted">Consulta somente leitura do estoque mantido no PVI — Controle de Publicações. <b>O Congregação Vila não altera nenhum dado do PVI.</b></p><div class="toolbar no-print"><button class="btn" onclick="loadPublicacoes()">🔄 Atualizar</button><button class="btn light" onclick="printIt('publicacoes')">🖨️ Imprimir / PDF</button><input id="pubBusca" placeholder="Pesquisar por código ou nome" style="min-width:260px;padding:10px;border:1px solid #bbb;border-radius:8px"></div><div id="pubStatus" class="muted">Carregando dados do PVI...</div><div id="pubTable"></div>`);
 document.getElementById('pubBusca').addEventListener('input',()=>renderPubRows(cache._publicacoes||[]));loadPublicacoes();
}
async function loadPublicacoes(){const st=document.getElementById('pubStatus'),box=document.getElementById('pubTable');if(!box)return;st.textContent='Atualizando estoque do PVI...';let q=await sb.from('publicacoes').select('codigo,name,ano,quantidade_atual,ativo').eq('ativo',true).order('codigo',{ascending:true});if(q.error){st.textContent='Não foi possível consultar o PVI: '+q.error.message;box.innerHTML='';return}cache._publicacoes=q.data||[];renderPubRows(cache._publicacoes)}
function renderPubRows(all){const busca=(document.getElementById('pubBusca')?.value||'').trim().toLowerCase();const rows=all.filter(x=>!busca||String(x.codigo||'').toLowerCase().includes(busca)||String(x.name||'').toLowerCase().includes(busca)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base'})||String(a.codigo||'').localeCompare(String(b.codigo||''),'pt-BR',{numeric:true,sensitivity:'base'}));document.getElementById('pubStatus').textContent=`${rows.length} publicação(ões) ativa(s) · dados do PVI · atualizado agora`;document.getElementById('pubTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Publicação</th><th>Ano</th><th style="text-align:center">Quantidade</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.codigo)}</b></td><td>${esc(x.name)}</td><td>${x.ano??'—'}</td><td style="font-size:20px;font-weight:bold;text-align:center;vertical-align:middle">${Number.isFinite(Number(x.quantidade_atual))?Number(x.quantidade_atual):0}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma publicação encontrada.</td></tr>'}</tbody></table></div>`}

function renderDiscursos(){const rec=cache.discursos.filter(x=>x.secao==='RECEBEREMOS'),env=cache.discursos.filter(x=>x.secao==='ENVIAREMOS');setContent(`<h2>🎤 Discursos Públicos</h2><p class="muted">Toque no <b>dia</b> para abrir e editar o registro.</p><div class="toolbar no-print"><button class="btn" onclick="reloadAndRender()">🔄 Atualizar</button><button class="btn light" onclick="printIt('discursos')">🖨️ Imprimir / PDF</button>${canEdit()?'<button class="btn gold" onclick="newSpeech()">➕ Novo registro</button>':''}</div><div class="discursos-screen">${speechSection('RECEBEREMOS',rec)}<div style="height:22px"></div>${speechSection('ENVIAREMOS',env)}</div><div class="discursos-print-only"><div class="speech-print-head">DISCURSOS PÚBLICOS 2026<br><span>ARRANJO DE ORADORES - CONGREGAÇÃO VILA INDUSTRIAL</span></div>${speechPrintMonth(rec,'RECEBEREMOS')}${speechPrintMonth(env,'ENVIAREMOS')}</div>`)}
function speechPrintMonth(rows,title){const months={};rows.forEach(x=>{const d=isoDate(x.data);const k=d?d.slice(0,7):'sem-data';(months[k]??=[]).push(x)});return Object.entries(months).sort(([a],[b])=>a.localeCompare(b)).map(([k,rs])=>{const [y,m]=k.split('-');const mn=m?['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][Number(m)-1].toUpperCase():'';return `<section class="speech-print-section"><h2>${title}</h2><div class="speech-print-month">MÊS : ${mn}</div><table><thead><tr><th>DIA</th><th>SEMANA</th><th>TEMA DO DISCURSO</th><th>ORADOR</th><th>CONGREGAÇÃO</th></tr></thead><tbody>${rs.sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(x=>`<tr><td>${x.data?String(x.data).slice(8,10):''}</td><td>${esc(x.semana||'')}</td><td>${esc(x.discurso||'')}</td><td>${esc(x.orador||'')}</td><td>${esc(x.congregacao||'')}</td></tr>`).join('')}<tr><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></section>`}).join('')}

function speechSection(title,rows){return `<div class="speech-section print-sheet"><div class="speech-title">${title}</div><div class="speech-table-wrap"><table class="speech-table"><thead><tr><th>DIA</th><th>SEMANA</th><th>DISCURSO</th><th>ORADOR</th><th>CONGREGAÇÃO</th>${canEdit()?'<th class="no-print">Ação</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${canEdit()?`<button type="button" class="date-link" onclick="editSpeech(${x.id})">${fmtDate(x.data)}</button>`:fmtDate(x.data)}</td><td>${esc(x.semana||'')}</td><td>${esc(x.discurso||'')}</td><td>${esc(x.orador||'')}</td><td>${esc(x.congregacao||'')}</td>${canEdit()?`<td class="no-print"><button class="btn light" onclick="editSpeech(${x.id})">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6">Nenhum registro cadastrado.</td></tr>'}</tbody></table></div></div>`}

async function savePerson(id){const nome=document.getElementById('fp_nome').value.trim(),email=document.getElementById('fp_email').value.trim().toLowerCase(),observacao=document.getElementById('fp_obs').value.trim();if(!nome)return alert('Informe o nome.');const payload={nome,email,observacao,ativo:true,updated_at:new Date().toISOString()};const r=id?await sb.from('priv_pessoas').update(payload).eq('id',id):await sb.from('priv_pessoas').insert(payload);if(r.error)return alert('Erro ao salvar pessoa: '+r.error.message);document.getElementById('modal').remove();await reloadAndRender()}

function renderAdmin(){if(!canEdit()){setContent('<h2>Administração</h2><div class="card">Acesso restrito ao administrador.</div>');return}setContent(`<h2>⚙️ Administração</h2><div class="grid"><div class="card"><h3>🔐 Acessos</h3><input id="newEmail" type="email" placeholder="e-mail" style="width:100%;margin-bottom:8px"><input id="newName" placeholder="nome" style="width:100%;margin-bottom:8px"><select id="newRole" style="width:100%;margin-bottom:8px"><option value="visualizador">Visualizador</option><option value="colaborador">Colaborador</option><option value="administrador">Administrador</option></select><button class="btn" onclick="authorize()">Autorizar / atualizar</button><p id="adminMsg" class="muted"></p></div><div class="card"><h3>📥 Bases mensais</h3><p>As próximas importações serão revisadas antes de publicação.</p><div class="goldbox">A programação oficial deve vir do JW.org. A numeração publicada é preservada.</div></div><div class="card"><h3>🔎 Estado das bases</h3><p>Privilégios: <b>${cache.designacoes.length}</b> designações · <b>${cache.habilitacoes.length}</b> habilitações.</p><p>Programa oficial: <b>${cache.oficiais.length}</b> itens.</p><p>Grupos: <b>${cache.grupos.length}</b> · Limpeza: <b>${cache.limpeza.length}</b> · Discursos: <b>${cache.discursos.length}</b>.</p></div></div>`)}
async function authorize(){let email=document.getElementById('newEmail').value.trim().toLowerCase(),nome=document.getElementById('newName').value.trim(),perfil=document.getElementById('newRole').value;if(!email)return;let r=await sb.from('priv_acessos').upsert({email,nome,perfil,ativo:true},{onConflict:'email'});document.getElementById('adminMsg').textContent=r.error?'Erro: '+r.error.message:'Acesso autorizado/atualizado.'}

async function reloadAndRender(){await loadBase();render()}
function goPage(p){if(!p)return; if(location.hash.slice(1)!==p){location.hash=p}else{render()}}
document.querySelectorAll('.side button,.mobile-nav button').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();goPage(b.dataset.page)}));
window.addEventListener('hashchange',render);
(async()=>{try{let s=await sb.auth.getSession();if(s.data.session){currentUser=s.data.session.user;await finishLogin()}}catch(e){console.error('Inicialização',e);msg('Não foi possível iniciar o aplicativo.')}})();
</script>
</body></html>
